<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Anmeldung abgebrochen</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    main { max-width: 480px; padding: 16px; text-align: center; }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    p { line-height: 1.5; }
    @media (prefers-color-scheme: dark) {
      body { background: #1b1b1b; color: #eee; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Anmeldung abgebrochen</h1>
    <p>Die Anmeldung wurde nicht abgeschlossen. Du kannst den Vorgang im Connector jederzeit erneut starten.</p>
  </main>
</body>
</html>
